{% extends "base.html" %}
{% block title %}Giriş{% endblock %}
{% block content %}
  <div class="panel">
    <h1>Giriş Yap</h1>
    <p class="sub">Kitaplığına ve ortak havuza eriş.</p>
    <form method="post">
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <button class="btn btn-primary btn-block" type="submit">Giriş Yap</button>
    </form>
    <p class="sub" style="margin-top:18px">Hesabın yok mu? <a href="{% url 'signup' %}">Kayıt ol</a></p>
  </div>
{% endblock %}
