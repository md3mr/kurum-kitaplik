<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kitaplık{% endblock %}</title>
</head>
<body>
  <header>
    <strong>📚 Kitaplık</strong>
    {% if user.is_authenticated %}
      <a href="{% url 'home' %}">Havuz</a>
      <a href="{% url 'my_books' %}">Kitaplığım</a>
      <a href="{% url 'requests' %}">Taleplerim</a>
      <span>{{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}" style="display:inline">
        {% csrf_token %}
        <button type="submit">Çıkış</button>
      </form>
    {% endif %}
  </header>
  {% if messages %}
    <ul>
      {% for message in messages %}<li>{{ message }}</li>{% endfor %}
    </ul>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
