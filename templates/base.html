{% load static %}
<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Kitaplık{% endblock %} · Kitaplık</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="{% url 'home' %}">📚 Kitaplık</a>
      {% if user.is_authenticated %}
        <nav class="links">
          <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}on{% endif %}">Havuz</a>
          <a href="{% url 'my_books' %}" class="{% if request.resolver_match.url_name == 'my_books' or request.resolver_match.url_name == 'book_add' %}on{% endif %}">Kitaplığım</a>
          <a href="{% url 'requests' %}" class="{% if request.resolver_match.url_name == 'requests' %}on{% endif %}">Taleplerim</a>
        </nav>
        <div class="who">
          <span>{{ user.username }}</span>
          <form class="inline" method="post" action="{% url 'logout' %}">
            {% csrf_token %}<button class="linkbtn" type="submit">Çıkış</button>
          </form>
        </div>
      {% endif %}
    </div>
  </header>

  {% if messages %}
    <div class="wrap toasts">
      {% for m in messages %}<div class="toast {{ m.tags }}">{{ m }}</div>{% endfor %}
    </div>
  {% endif %}

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
